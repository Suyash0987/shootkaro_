<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Outer Cinema Lens Barrel -->
  <circle cx="50" cy="50" r="46.5" stroke="#000000" stroke-width="3"/>
  <circle cx="50" cy="50" r="44" fill="#000000"/>

  <!-- Precision Calibrated Focus Notches -->
  <line x1="50" y1="0.5" x2="50" y2="5" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="95" x2="50" y2="99.5" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0.5" y1="50" x2="5" y2="50" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="95" y1="50" x2="99.5" y2="50" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="15" x2="18.5" y2="18.5" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="15" x2="81.5" y2="18.5" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="15" y1="85" x2="18.5" y2="81.5" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="85" x2="81.5" y2="81.5" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- 8 Interlocking Precision Camera Shutter Blades -->
  <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tangential Blade Lines -->
    <line x1="64.0" y1="50.0" x2="64.0" y2="91.7"/>
    <line x1="59.9" y1="59.9" x2="30.4" y2="89.4"/>
    <line x1="50.0" y1="64.0" x2="8.3"  y2="64.0"/>
    <line x1="40.1" y1="59.9" x2="10.6" y2="30.4"/>
    <line x1="36.0" y1="50.0" x2="36.0" y2="8.3"/>
    <line x1="40.1" y1="40.1" x2="69.6" y2="10.6"/>
    <line x1="50.0" y1="36.0" x2="91.7" y2="36.0"/>
    <line x1="59.9" y1="40.1" x2="89.4" y2="69.6"/>
  </g>

  <!-- Central Optical Aperture Pupil -->
  <polygon points="64.0,50.0 59.9,59.9 50.0,64.0 40.1,59.9 36.0,50.0 40.1,40.1 50.0,36.0 59.9,40.1" fill="#000000" stroke="#ffffff" stroke-width="1.8"/>

  <!-- Inner Glass Element & Lens Flare Reflection -->
  <circle cx="50" cy="50" r="7" fill="#111111"/>
  <path d="M 45 44 A 6 6 0 0 1 54 44" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="55" cy="48" r="1.2" fill="#ffffff"/>
</svg>
