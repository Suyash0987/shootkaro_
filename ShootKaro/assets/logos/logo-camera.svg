<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Minimalist Camera Silhouette -->
  <rect x="8" y="24" width="84" height="64" rx="14" stroke="#000000" stroke-width="4.5" fill="#000000"/>
  
  <!-- Shutter & Viewfinder Crown -->
  <path d="M 34 24 L 40 14 H 60 L 66 24 Z" fill="#000000"/>
  <rect x="18" y="15" width="10" height="9" rx="2" fill="#000000"/>
  
  <!-- Viewfinder Window & Flash Accent -->
  <rect x="70" y="32" width="12" height="8" rx="2" fill="#ffffff"/>
  <circle cx="22" cy="36" r="3" fill="#ffffff"/>

  <!-- Centered Precision Aperture Lens Barrel -->
  <circle cx="50" cy="56" r="24" fill="#000000" stroke="#ffffff" stroke-width="3"/>
  <circle cx="50" cy="56" r="21" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Iris Blades inside Lens -->
  <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round">
    <line x1="56" y1="56" x2="65" y2="72"/>
    <line x1="53" y1="61" x2="35" y2="69"/>
    <line x1="47" y1="61" x2="35" y2="46"/>
    <line x1="44" y1="56" x2="52" y2="39"/>
    <line x1="47" y1="51" x2="65" y2="43"/>
  </g>

  <!-- Center Pupil & Lens Flare -->
  <circle cx="50" cy="56" r="6" fill="#000000" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="52" cy="54" r="1.2" fill="#ffffff"/>
</svg>
